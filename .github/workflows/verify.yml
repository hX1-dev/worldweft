name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  static-and-unit:
    name: Source, static checks, and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run godot:check-source
      - run: npm run godot:check-static
      - run: npm run godot:check-soak-policy
      - run: npm run godot:check-unit

  windows:
    name: Windows commands
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test -- --runInBand convex/godotBridgeAuth.test.ts
      - run: npm run godot:check-source
      - run: npm run godot:check-static
      - run: npm run godot:check-soak-policy
      - run: npm run godot:check-unit -- --runInBand

  life-and-dialogue:
    name: Life baseline and dialogue checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run life:check-baseline -- --quick
      - run: npm run dialogue:check-memory
      - run: npm run dialogue:check-affinity
