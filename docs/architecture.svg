<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="670" viewBox="0 0 1200 670" role="img" aria-labelledby="title desc">
  <title id="title">Worldweft runtime architecture</title>
  <desc id="desc">Godot and bounded NPC turns submit semantic actions to Convex. Convex validates and settles the actions, persists facts, and returns viewer-safe state and history. Life and dialogue labs are documented separately.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#b6c9cb"/></marker>
    <marker id="readArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#79bfcd"/></marker>
    <style>
      text { font-family:Segoe UI,Helvetica,Arial,sans-serif; }
      .title { fill:#f1f6f4; font-size:28px; font-weight:600; }
      .sub { fill:#9bb5b8; font-size:16px; }
      .label { fill:#b9d6a5; font-size:13px; font-weight:600; letter-spacing:1.8px; }
      .heading { fill:#f1f6f4; font-size:23px; font-weight:600; }
      .body { fill:#b7cbcd; font-size:17px; }
      .note { fill:#9bb5b8; font-size:14px; }
      .box { fill:#16252c; stroke:#345059; stroke-width:1.5; }
      .rule { stroke:#345059; stroke-width:1; }
      .flow { fill:none; stroke:#b6c9cb; stroke-width:2; marker-end:url(#arrow); }
    </style>
  </defs>
  <rect x="0.5" y="0.5" width="1199" height="669" rx="20" fill="#101a21" stroke="#2b4045"/>
  <text x="40" y="49" class="title">From intent to a persistent world</text>
  <text x="40" y="80" class="sub">Current runtime · one rule-owned path for player and resident actions</text>

  <rect x="40" y="125" width="300" height="132" rx="12" class="box"/>
  <text x="64" y="157" class="label">INPUT + PRESENTATION</text>
  <text x="64" y="191" class="heading">Godot client</text>
  <text x="64" y="224" class="body">Movement, interaction, UI</text>

  <rect x="40" y="305" width="300" height="132" rx="12" class="box"/>
  <text x="64" y="337" class="label">AUTONOMOUS TURNS</text>
  <text x="64" y="371" class="heading">Resident decision layer</text>
  <text x="64" y="404" class="body">Context → legal intent</text>

  <rect x="430" y="125" width="340" height="312" rx="12" fill="#172b31" stroke="#79bfcd" stroke-width="1.5"/>
  <text x="455" y="157" class="label">WORLD AUTHORITY</text>
  <text x="455" y="191" class="heading">Convex runtime</text>
  <path d="M455 212 H745" class="rule"/>
  <text x="455" y="247" class="body">01  Bind identity and scope</text>
  <text x="455" y="286" class="body">02  Check current world rules</text>
  <text x="455" y="325" class="body">03  Settle the action once</text>
  <path d="M455 350 H745" class="rule"/>
  <text x="455" y="382" class="note">Presence · capability · prerequisites</text>
  <text x="455" y="405" class="note">Risk · retry identity · consequences</text>

  <rect x="860" y="125" width="300" height="312" rx="12" class="box"/>
  <text x="884" y="157" class="label">DURABLE FACTS</text>
  <text x="884" y="191" class="heading">World state + history</text>
  <path d="M884 212 H1136" class="rule"/>
  <text x="884" y="252" class="body">Profiles and inventories</text>
  <text x="884" y="291" class="body">Relationships and memories</text>
  <text x="884" y="330" class="body">Action records and events</text>
  <text x="884" y="396" class="note">Changes retain linked evidence.</text>

  <rect x="430" y="505" width="730" height="105" rx="12" class="box"/>
  <text x="455" y="538" class="label">READ MODELS + HISTORY</text>
  <text x="455" y="577" class="body">Viewer-safe state · action results · presentation · replay</text>

  <path d="M340 191 H430" class="flow"/>
  <path d="M340 371 H430" class="flow"/>
  <path d="M770 281 H860" class="flow"/>
  <path d="M1010 437 V505" class="flow"/>
  <path d="M430 557 H20 V191 H40" fill="none" stroke="#79bfcd" stroke-width="2" marker-end="url(#readArrow)"/>
  <text x="59" y="521" class="note">State and results return</text>
  <text x="59" y="544" class="note">to the client.</text>
  <text x="40" y="643" class="note">Life and player dialogue currently run in separate labs. See the architecture guide for their integration paths.</text>
</svg>
